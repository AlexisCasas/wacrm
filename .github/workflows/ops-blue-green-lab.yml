name: WACRM OPS blue-green lab

on:
  pull_request:
    paths:
      - "ops/deploy/**"
      - ".github/workflows/ops-blue-green-lab.yml"

permissions:
  contents: read

jobs:
  docker-alias-switch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Verify Bash syntax of deploy, rollback and audit scripts
        shell: bash
        run: |
          set -euo pipefail
          for script in ops/deploy/*.sh; do bash -n "$script"; done
      - name: Verify bounded rename retry and fail-closed semantics
        shell: bash
        run: |
          set -euo pipefail
          . ops/deploy/lib.sh
          attempt=0
          docker() {
            attempt=$((attempt + 1))
            [ "$1" = rename ] || return 99
            [ "$attempt" -ne 1 ]
          }
          retry_rename qa-old qa-live
          [ "$attempt" -eq 2 ] || exit 1
          attempt=0
          docker() { attempt=$((attempt + 1)); return 1; }
          if retry_rename qa-old qa-live; then
            echo "OPS RENAME FAIL: persistent Docker error was accepted"; exit 1
          fi
          [ "$attempt" -eq 3 ] || exit 1
          echo "OPS_RENAME_RETRY=PASS"
      - name: Pull disposable Node image
        run: docker pull node:20-alpine
      - name: Verify candidate Compose overlay parses without the public alias
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/wacrm-qa-base.yml <<'YAML'
          services:
            app:
              image: node:20-alpine
              container_name: wacrm-app-1
              ports:
                - "127.0.0.1:39999:3000"
              networks:
                edge_proxy:
                  aliases:
                    - wacrm-app
          networks:
            edge_proxy:
          YAML
          PROJECT="wacrm-cand-$(date -u +%Y%m%dT%H%M%SZ | tr '[:upper:]' '[:lower:]')"
          CAND_NAME=qa-candidate docker compose -p "$PROJECT" \
            -f /tmp/wacrm-qa-base.yml \
            -f ops/deploy/candidate.override.yml \
            config --format json > /tmp/wacrm-qa-config.json
          node -e 'const c=require("/tmp/wacrm-qa-config.json"); const app=c.services.app; const a=app.networks.edge_proxy.aliases; if(JSON.stringify(a)!==JSON.stringify(["qa-candidate"])||(app.ports||[]).length!==0){console.error(a,app.ports);process.exit(1)}'
      - name: Reject home-page readiness on new candidates
        shell: bash
        run: |
          if READY_PATH=/ bash ops/deploy/deploy.sh node:20-alpine > /tmp/readiness-reject.log 2>&1; then
            echo 'OPS LAB FAIL: redirected home page was accepted as readiness'; exit 1
          fi
          grep -q 'not a database readiness gate' /tmp/readiness-reject.log
      - name: Reject missing proxy logs (never report a false 502 PASS)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/qa-wacrm-fake-bin
          printf '#!/bin/sh\nexit 1\n' > /tmp/qa-wacrm-fake-bin/docker
          chmod +x /tmp/qa-wacrm-fake-bin/docker
          if PATH="/tmp/qa-wacrm-fake-bin:$PATH" bash ops/deploy/verify-no-502.sh --since 5m; then
            echo 'OPS LAB FAIL: missing proxy logs incorrectly passed'; exit 1
          fi
      - name: Test database-backed first rollback against isolated REST endpoint
        shell: bash
        run: |
          set -euo pipefail
          NET="qa-legacy-rollback-${{ github.run_id }}-${{ github.run_attempt }}"
          cleanup() {
            docker rm -f "$NET-db" "$NET-prev" "$NET-prev-bad" >/dev/null 2>&1 || true
            docker network rm "$NET" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create "$NET" >/dev/null
          HTTP='const http=require("http");http.createServer((req,res)=>{
            if(req.url.startsWith("/rest/v1/accounts?") && req.headers.apikey==="qa-test-key"){
              res.writeHead(200,{"Content-Type":"application/json"});res.end("[]")
            } else {res.writeHead(401);res.end("unauthorized")}
          }).listen(3000,"0.0.0.0")'
          docker run -d --name "$NET-db" --network "$NET" --entrypoint node node:20-alpine -e "$HTTP" >/dev/null
          docker run -d --name "$NET-prev" --network "$NET" \
            -e NEXT_PUBLIC_SUPABASE_URL="http://$NET-db:3000" \
            -e SUPABASE_SERVICE_ROLE_KEY=qa-test-key \
            --entrypoint node node:20-alpine -e 'setInterval(()=>{},1000)' >/dev/null
          docker run -d --name "$NET-prev-bad" --network "$NET" \
            -e NEXT_PUBLIC_SUPABASE_URL="http://$NET-db:3000" \
            -e SUPABASE_SERVICE_ROLE_KEY=wrong-key \
            --entrypoint node node:20-alpine -e 'setInterval(()=>{},1000)' >/dev/null
          . ops/deploy/lib.sh
          ready=0
          for _ in $(seq 1 20); do
            if [ "$(legacy_db_ready_status "$NET-prev")" = 200 ]; then ready=1; break; fi
            sleep 1
          done
          [ "$ready" = 1 ] || { echo 'OPS LAB FAIL: valid legacy DB probe'; exit 1; }
          [ "$(rollback_ready_status "$NET-prev")" = 200 ] || exit 1
          [ "$(legacy_db_ready_status "$NET-prev-bad")" = 503 ] || { echo 'OPS LAB FAIL: invalid credentials accepted'; exit 1; }
          echo 'OPS_LEGACY_ROLLBACK_DB=PASS'
      - name: Verify old container can restart privately before rollback
        shell: bash
        run: |
          set -euo pipefail
          bash ops/deploy/lab-private-rollback.sh
      - name: Preserve 12 inflight requests while swapping alias
        shell: bash
        run: |
          set -euo pipefail
          bash ops/deploy/lab-alias-flip.sh node:20-alpine sigterm-first | tee /tmp/wacrm-blue-green-lab.log
          result="$(sed -n 's/^RESULT\[sigterm-first\]: //p' /tmp/wacrm-blue-green-lab.log | tail -n 1)"
          if [ -z "$result" ]; then echo "OPS LAB FAIL: no result JSON"; exit 1; fi
          node -e '
            const x=JSON.parse(process.argv[1]);
            console.log("Traffic:", x.total, "failures:", x.fail, "slow completed:", x.slow.ok, "slow failed:", x.slow.failed);
            if(x.fail!==0 || x.slow.ok!==12 || x.slow.failed!==0 || !(x.counts.a>0) || !(x.counts.b>0)) process.exit(1);
            console.log("OPS_BLUE_GREEN_LAB=PASS");
          ' "$result"
