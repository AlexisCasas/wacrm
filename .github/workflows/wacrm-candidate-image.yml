name: WACRM candidate image (manual, artifact only)

on:
  pull_request:
    paths:
      - ".github/workflows/wacrm-candidate-image.yml"
      - "docs/ops/CANDIDATE-IMAGE-CI.md"
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Exact 40-character SHA at main HEAD; no implicit latest"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: wacrm-candidate-${{ github.event.inputs.release_sha }}
  cancel-in-progress: false

jobs:
  validate-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Confirm manual-only candidate packaging policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          flow = Path('.github/workflows/wacrm-candidate-image.yml').read_text()
          assert 'workflow_dispatch:' in flow
          candidate = flow.split('  build-candidate:\n', 1)[1]
          assert "if: github.event_name == 'workflow_dispatch'" in candidate
          assert 'docker save' in candidate and 'sha256sum' in candidate
          assert 'docker push' not in candidate and 'docker load' not in candidate
          assert 'SUPABASE_SERVICE_ROLE_KEY' not in candidate and 'META_APP_SECRET' not in candidate
          assert 'WACRM_NEXT_PUBLIC_SUPABASE_ANON_KEY' in candidate
          assert 'Validate untrusted release input before checkout' in candidate
          assert 'SHA="$RELEASE_SHA_INPUT"' in candidate
          assert 'RELEASE_SHA_INPUT: ${{ inputs.release_sha }}' in candidate
          assert 'SHA="${{ inputs.release_sha }}"' not in candidate
          assert 'ref: ${{ steps.validated.outputs.sha }}' in candidate
          print('CANDIDATE_MANUAL_ONLY_CONTRACT=PASS')
          PY

  build-candidate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Public values must match the current production build config.
    # These are compile-time NEXT_PUBLIC_* variables, not server secrets.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.WACRM_NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.WACRM_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.WACRM_NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_APP_LOCALE: ${{ vars.WACRM_NEXT_PUBLIC_APP_LOCALE || 'en' }}
    steps:
      # Inputs are untrusted strings: pass through env (never raw expression
      # interpolation inside a shell script) and validate BEFORE checkout.
      - name: Validate untrusted release input before checkout
        id: validated
        shell: bash
        env:
          RELEASE_SHA_INPUT: ${{ inputs.release_sha }}
          RUN_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          SHA="$RELEASE_SHA_INPUT"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid release SHA"; exit 1; }
          [ "$RUN_REF" = "refs/heads/main" ] || { echo "Workflow must run from main"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exact release SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.validated.outputs.sha }}
          fetch-depth: 0

      - name: Gate SHA, main and compile-time public configuration
        id: preflight
        shell: bash
        env:
          VERIFIED_SHA: ${{ steps.validated.outputs.sha }}
        run: |
          set -euo pipefail
          SHA="$VERIFIED_SHA"
          [ "$(git rev-parse HEAD)" = "$SHA" ] || { echo "Checkout drift"; exit 1; }
          [ "$(git rev-parse origin/main)" = "$SHA" ] || { echo "Release is not the current main HEAD"; exit 1; }
          [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] && [ -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ] ||
            { echo "Missing production public Supabase configuration in repository vars/secrets"; exit 1; }
          case "$NEXT_PUBLIC_SUPABASE_URL" in https://*) ;; *) echo "Expected HTTPS Supabase URL"; exit 1 ;; esac
          TAG="wacrm-app:candidate-${SHA:0:12}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          # Publish only a fingerprint, never the public key itself.
          {
            printf '%s\0' "$NEXT_PUBLIC_SUPABASE_URL"
            printf '%s\0' "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
            printf '%s\0' "$NEXT_PUBLIC_SITE_URL"
            printf '%s\0' "$NEXT_PUBLIC_APP_LOCALE"
          } | sha256sum | cut -d ' ' -f1 > /tmp/wacrm-public-build-config.sha256
          echo "CANDIDATE_PREFLIGHT=PASS"

      - name: Build candidate image outside VPS
        shell: bash
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --pull \
            --build-arg NEXT_PUBLIC_SUPABASE_URL \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --build-arg NEXT_PUBLIC_SITE_URL \
            --build-arg NEXT_PUBLIC_APP_LOCALE \
            --label "org.opencontainers.image.revision=${{ steps.preflight.outputs.sha }}" \
            --label "org.opencontainers.image.source=https://github.com/AlexisCasas/wacrm" \
            -t "${{ steps.preflight.outputs.tag }}" .
          actual="$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' '${{ steps.preflight.outputs.tag }}')"
          [ "$actual" = "${{ steps.preflight.outputs.sha }}" ] ||
            { echo "Revision label mismatch"; exit 1; }
          [ "$(docker image inspect -f '{{.Os}}/{{.Architecture}}' '${{ steps.preflight.outputs.tag }}')" = "linux/amd64" ] ||
            { echo "Unexpected image architecture"; exit 1; }
          echo "CANDIDATE_BUILD=PASS"

      - name: Export image and verify archive SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          docker save '${{ steps.preflight.outputs.tag }}' | gzip -1 > release/wacrm-candidate-image.tar.gz
          ( cd release && sha256sum wacrm-candidate-image.tar.gz > SHA256SUMS && sha256sum --check SHA256SUMS )
          image_id="$(docker image inspect -f '{{.Id}}' '${{ steps.preflight.outputs.tag }}')"
          {
            echo "SOURCE_SHA=${{ steps.preflight.outputs.sha }}"
            echo "IMAGE_TAG=${{ steps.preflight.outputs.tag }}"
            echo "IMAGE_ID=$image_id"
            echo "PLATFORM=linux/amd64"
            echo "PUBLIC_BUILD_CONFIG_SHA256=$(cat /tmp/wacrm-public-build-config.sha256)"
            echo "BUILT_AT_UTC=$(date -u +%FT%TZ)"
            echo "DEPLOYED=false"
          } > release/manifest.txt
          echo "CANDIDATE_ARTIFACT_SHA256=PASS"

      - name: Upload candidate artifact (no deployment)
        uses: actions/upload-artifact@v4
        with:
          name: wacrm-candidate-${{ steps.preflight.outputs.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  # Temporary RC2 packaging gate. PR #154 runs this scoped review job.
  # Checkout and build use only exact authorized HEAD of PR #153.
  build-rc2-from-stacked-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 154 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'release/wacrm-calling-rc2-prod-parity-20261121'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPECTED_RELEASE_SHA: 14c5f3c8c1ab41db76841a0c7680efbc577ddd9f
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.WACRM_NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.WACRM_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.WACRM_NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_APP_LOCALE: ${{ vars.WACRM_NEXT_PUBLIC_APP_LOCALE || 'en' }}
    steps:
      - name: Checkout pinned release source instead of QA branch
        uses: actions/checkout@v7
        with:
          ref: 14c5f3c8c1ab41db76841a0c7680efbc577ddd9f
          fetch-depth: 0
          persist-credentials: false
      - name: Fail closed on source drift or missing public production config
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$EXPECTED_RELEASE_SHA" ] || exit 1
          REMOTE_HEAD="$(git ls-remote origin refs/heads/release/wacrm-calling-rc2-prod-parity-20261121 | cut -f1)"
          [ "$REMOTE_HEAD" = "$EXPECTED_RELEASE_SHA" ] || { echo 'RC2 source drift'; exit 1; }
          [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] && [ -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ] || { echo 'Missing public production configuration'; exit 1; }
          case "$NEXT_PUBLIC_SUPABASE_URL" in https://*) ;; *) echo 'Supabase URL must be HTTPS'; exit 1 ;; esac
          case "$NEXT_PUBLIC_SUPABASE_URL:$NEXT_PUBLIC_SITE_URL" in *127.0.0.1*|*localhost*|*:38089*) echo 'QA origin forbidden'; exit 1 ;; esac
          [ -z "$(git status --porcelain)" ] || exit 1
          echo 'RC2_SOURCE_AND_PUBLIC_CONFIG=PASS'
      - name: Build isolated production-configured RC2 image
        shell: bash
        run: |
          set -euo pipefail
          TAG="wacrm-app:rc2-${EXPECTED_RELEASE_SHA:0:8}"
          TREE="$(git rev-parse HEAD^{tree})"
          docker build --platform linux/amd64 --pull \
            --build-arg NEXT_PUBLIC_SUPABASE_URL \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --build-arg NEXT_PUBLIC_SITE_URL \
            --build-arg NEXT_PUBLIC_APP_LOCALE \
            --label "org.opencontainers.image.revision=$EXPECTED_RELEASE_SHA" \
            --label "io.wacrm.source-tree=$TREE" \
            --label "org.opencontainers.image.source=https://github.com/AlexisCasas/wacrm" \
            -t "$TAG" .
          [ "$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$TAG")" = "$EXPECTED_RELEASE_SHA" ]
          [ "$(docker image inspect -f '{{ .Os }}/{{ .Architecture }}' "$TAG")" = linux/amd64 ]
          echo 'RC2_ISOLATED_BUILD=PASS'
          mkdir -p release
          docker save "$TAG" | gzip -1 > release/image.tar.gz
          (
            cd release
            sha256sum image.tar.gz > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          CONFIG_FP="$(
            {
              printf '%s\0' "$NEXT_PUBLIC_SUPABASE_URL"
              printf '%s\0' "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
              printf '%s\0' "$NEXT_PUBLIC_SITE_URL"
              printf '%s\0' "$NEXT_PUBLIC_APP_LOCALE"
            } | sha256sum | cut -d ' ' -f1
          )"
          {
            printf 'SOURCE_SHA=%s\n' "$EXPECTED_RELEASE_SHA"
            printf 'SOURCE_TREE=%s\n' "$TREE"
            printf 'IMAGE_TAG=%s\n' "$TAG"
            printf 'IMAGE_ID=%s\n' "$(docker image inspect -f '{{ .Id }}' "$TAG")"
            printf 'PLATFORM=linux/amd64\n'
            printf 'PUBLIC_BUILD_CONFIG_SHA256=%s\n' "$CONFIG_FP"
            printf 'DEPLOYED=false\n'
          } > release/manifest.txt
          echo 'RC2_IMAGE_ARCHIVE_AND_SHA256=PASS'
      - name: Upload pinned RC2 image for manual verification
        uses: actions/upload-artifact@v4
        with:
          name: wacrm-rc2-14c5f3c8
          path: release/
          retention-days: 3
          if-no-files-found: error
