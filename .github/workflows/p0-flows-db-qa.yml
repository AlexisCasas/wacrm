name: P0 Flows DB QA (isolated)

on:
  pull_request:
    paths:
      - ".github/workflows/p0-flows-db-qa.yml"
      - "qa/p0-flows-db/**"

permissions:
  contents: read

concurrency:
  group: p0-flows-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-flows:
    name: "${{ matrix.label }} / PostgreSQL 17 + PostgREST"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "PR 95 / send intent S01-S29"
            target_sha: "6257acfedd981205d28a9f8c97341783512e6d1d"
          - label: "PR 96 / recovery S01-S29"
            target_sha: "601d32cd62a920f805df87b47d8150534db6286e"
    steps:
      - name: Checkout isolated QA harness
        uses: actions/checkout@v7
        with:
          path: qa-harness
          persist-credentials: false

      - name: Checkout fixed target commit
        uses: actions/checkout@v7
        with:
          ref: "${{ matrix.target_sha }}"
          path: source
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install source dependencies
        working-directory: source
        run: npm ci

      - name: Verify isolated Flow engine against disposable database
        env:
          QA_PROJECT_ROOT: "${{ github.workspace }}/source"
          QA_TEST_FILE: src/lib/flows/subflow-exec.engine.http.test.ts
        run: bash qa-harness/qa/p0-flows-db/run.sh
